[package]
name = "partially_core"
version = "0.1.0"
edition = "2024"

[features]
default = []
codegen = ["dep:quote", "dep:proc-macro2"]

[dependencies]
derive_builder = "0.20"
proc-macro2 = { version = "1.0", optional = true }
quote = { version = "1.0", optional = true }

[dev-dependencies]
# Enables codegen for tests
partially_core = { path = "./", version = "*", features = ["codegen"] }
